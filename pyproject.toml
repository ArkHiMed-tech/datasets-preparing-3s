[project]
name = "datasets-preparing-3s"
version = "0.1.0"
description = "Dataset preparation, model training, and diabetes risk analysis"
requires-python = ">=3.10,<3.11"
dependencies = [
    "catboost>=1.0,<2.0",
    "joblib>=1.3,<2.0",
    "lightgbm>=3.3,<5.0",
    "lime>=0.1,<1.0",
    "matplotlib>=3.7,<4.0",
    "numpy>=1.24,<3.0",
    "pandas>=1.5,<3.0",
    "scikit-learn>=1.2,<2.0",
    "seaborn>=0.12,<1.0",
    "shap>=0.43,<1.0",
    "streamlit>=1.25,<2.0",
    "xgboost>=1.5,<3.0",
]

[tool.uv]
package = false
